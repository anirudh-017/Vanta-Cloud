<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080a0e"
    >

    <title>
        {{ error_title }} · {{ app_name }}
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                system-ui,
                sans-serif;

            color:
                rgba(255, 255, 255, 0.94);

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(110, 135, 170, 0.13),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(120, 100, 145, 0.09),
                    transparent 38%
                ),
                linear-gradient(
                    145deg,
                    #07090d,
                    #10151c,
                    #191f28
                );

        }

        .error-card {

            width:
                min(
                    520px,
                    100%
                );

            padding: 34px;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 24px;

            background:
                rgba(255, 255, 255, 0.04);

            box-shadow:
                0 24px 80px
                rgba(0, 0, 0, 0.30);

        }

        .brand {

            margin-bottom: 35px;

            color:
                rgba(255, 255, 255, 0.38);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1.5px;

            text-transform: uppercase;

        }

        .error-code {

            display: inline-flex;

            padding:
                6px 10px;

            margin-bottom: 17px;

            border:
                1px solid
                rgba(230, 150, 150, 0.17);

            border-radius: 999px;

            color:
                rgba(240, 180, 180, 0.80);

            background:
                rgba(220, 110, 110, 0.06);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 1px;

        }

        h1 {

            margin:
                0 0 12px;

            font-size:
                clamp(
                    28px,
                    6vw,
                    38px
                );

            letter-spacing: -1.2px;

        }

        p {

            margin:
                0 0 30px;

            color:
                rgba(255, 255, 255, 0.47);

            font-size: 13px;

            line-height: 1.7;

        }

        .actions {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }

        a {

            min-height: 42px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                0 17px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 11px;

            font-weight: 650;

        }

        .primary {

            color: #11161d;

            background:
                linear-gradient(
                    135deg,
                    #e5edf6,
                    #bac9db
                );

        }

        .secondary {

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            color:
                rgba(255, 255, 255, 0.68);

            background:
                rgba(255, 255, 255, 0.035);

        }

        .secondary:hover {

            background:
                rgba(255, 255, 255, 0.07);

        }

    </style>

</head>


<body>

    <main class="error-card">

        <div class="brand">
            {{ app_name }}
        </div>


        <div class="error-code">
            ERROR {{ error_code }}
        </div>


        <h1>
            {{ error_title }}
        </h1>


        <p>
            {{ error_message }}
        </p>


        <div class="actions">

            <a
                class="primary"
                href="/"
            >
                Back to Cloud
            </a>


            <a
                class="secondary"
                href="javascript:history.back()"
            >
                Go back
            </a>

        </div>

    </main>

</body>

</html>
